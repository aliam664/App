name: Platform checks
on:
  push:
    branches: [arena/37af8e92-app]
  pull_request:
permissions:
  contents: read
jobs:
  web-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
  windows-native:
    runs-on: windows-latest
    env:
      VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      UHM_LICENSE_PUBLIC_JWK: ${{ vars.UHM_LICENSE_PUBLIC_JWK }}
      UHM_LICENSE_ISSUER: ${{ vars.UHM_LICENSE_ISSUER }}
      UHM_LICENSE_KEY_ID: ${{ vars.UHM_LICENSE_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Prepare integrity-pinned archive tools
        shell: pwsh
        run: ./scripts/prepare-extractor.ps1
      - run: npm run build
      - name: Native security and recovery tests
        working-directory: src-tauri
        run: |
          cargo test 2>&1 | Tee-Object -FilePath native-test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content native-test.log -Tail 100) -join "`n"
            if ($tail.Length -gt 3500) { $tail = $tail.Substring($tail.Length - 3500) }
            $tail = $tail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Native test output::$tail"
            exit $code
          }
      - uses: taiki-e/install-action@cargo-audit
      - name: Audit native dependencies
        working-directory: src-tauri
        run: |
          cargo audit 2>&1 | Tee-Object -FilePath native-audit.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content native-audit.log -Tail 100) -join "`n"
            if ($tail.Length -gt 3500) { $tail = $tail.Substring($tail.Length - 3500) }
            $tail = $tail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Native dependency audit::$tail"
            exit $code
          }
      - name: Build unsigned test installer
        run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: uhm-windows-unsigned-test
          path: src-tauri/target/release/bundle/nsis/*.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-dependency-lock
          path: src-tauri/Cargo.lock

      - name: Expose initial dependency lock for reproducible bootstrap
        if: always()
        shell: pwsh
        run: |
          if ((Test-Path src-tauri/Cargo.lock) -and !(git ls-files src-tauri/Cargo.lock)) {
            $bytes = [IO.File]::ReadAllBytes("$pwd/src-tauri/Cargo.lock")
            $memory = [IO.MemoryStream]::new()
            $gzip = [IO.Compression.GZipStream]::new($memory,[IO.Compression.CompressionMode]::Compress,$true)
            $gzip.Write($bytes,0,$bytes.Length)
            $gzip.Dispose()
            $value = [Convert]::ToBase64String($memory.ToArray())
            $part = 0
            for ($offset = 0; $offset -lt $value.Length; $offset += 3000) {
              $part++
              $chunk = $value.Substring($offset,[Math]::Min(3000,$value.Length - $offset))
              Write-Output ("::notice title=Native dependency lock {0}::{1}" -f $part,$chunk)
            }
          }

name: Refresh compiled branch preview
on:
  push:
    branches: [arena/37af8e92-app]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: write
concurrency:
  group: branch-preview
  cancel-in-progress: true
jobs:
  refresh:
    if: github.ref == 'refs/heads/arena/37af8e92-app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: npm run build:branch
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - run: npm run build:live-branch
      - name: Keep the exact audited Windows dependency lock when its manifest still matches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?branch=arena%2F37af8e92-app&status=success&per_page=1" > "$RUNNER_TEMP/native-runs.json"
          run=$(jq -r '.workflow_runs[0].id // empty' "$RUNNER_TEMP/native-runs.json")
          built_sha=$(jq -r '.workflow_runs[0].head_sha // empty' "$RUNNER_TEMP/native-runs.json")
          if [ -n "$run" ] && [ -n "$built_sha" ]; then
            git fetch origin "$built_sha" --depth=1
            if git diff --quiet "$built_sha" HEAD -- src-tauri/Cargo.toml; then
              gh run download "$run" --name native-dependency-lock --dir "$RUNNER_TEMP/native-lock"
              cp "$RUNNER_TEMP/native-lock/Cargo.lock" src-tauri/Cargo.lock
            else
              echo 'Dependency manifest changed; waiting for its own successful Windows checks.'
            fi
          fi
      - name: Store generated connected UI from the shared source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages-preview src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh generated preview and verified native dependency lock [skip ci]'
            git push origin HEAD:arena/37af8e92-app
          fi
      - name: Rebuild legacy Pages when that source is selected
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api 'repos/${{ github.repository }}/pages' --jq '.build_type')
          if [ "$source" = 'legacy' ]; then
            gh api --method POST 'repos/${{ github.repository }}/pages/builds'
          fi

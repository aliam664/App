name: Publish shared app UI to GitHub Pages
on:
  push:
    branches: [main, arena/37af8e92-app]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_BASE_PATH: /App/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:pages
      - run: npm run verify:builds
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pages-browser-failure-traces
          path: test-results/
          retention-days: 7
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Use compiled Actions deployment, never publish raw TypeScript
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/pages" -f build_type=workflow
      - uses: actions/configure-pages@v5
      - name: Deploy the same compiled UI
        id: deployment
        uses: actions/deploy-pages@v4

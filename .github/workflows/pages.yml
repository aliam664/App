name: Publish shared app UI to GitHub Pages
on:
  push:
    branches: [main, arena/0b78cac4-app]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_source: ${{ steps.pages-source.outputs.type }}
    env:
      PAGES_BASE_PATH: /App/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Detect the configured Pages source
        id: pages-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "type=$(gh api 'repos/${{ github.repository }}/pages' --jq '.build_type')" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
      - run: npm run build:pages
      - run: npm run build:branch
      - run: npm run verify:builds
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - run: npm run build:live-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pages-browser-failure-traces
          path: test-results/
          retention-days: 7
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.pages_source == 'workflow'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the same compiled UI
        id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; script-src 'self';">
  <title>UHM Pack Installer</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/library.css" />
  <link rel="stylesheet" href="css/donate.css" />
</head>
<body dir="rtl" data-theme="night">

  <div id="titlebar">
    <div class="brand">
      <img src="assets/images/logo.jpg" alt="UHM" />
      <span id="app-name-label">UHM Pack Installer</span>
    </div>
    <div class="titlebar-actions">
      <button class="titlebar-btn" id="btn-theme-toggle" title="تغییر تم" aria-label="Toggle theme"><span class="tb-icon"></span></button>
      <button class="titlebar-btn" id="btn-settings" title="تنظیمات" aria-label="Settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
      <button class="titlebar-btn" id="btn-minimize" title="کوچک کردن" aria-label="Minimize">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <button class="titlebar-btn" id="btn-maximize" title="بزرگ کردن" aria-label="Maximize">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>
      </button>
      <button class="titlebar-btn close" id="btn-close" title="بستن" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
      </button>
    </div>
  </div>

  <div id="page-content"></div>

  <div id="toast-wrap" class="toast-wrap"></div>
  <div id="modal-wrap" class="modal-wrap"></div>

  <!-- ترتیب بارگذاری مهم است -->
  <script src="js/browser-preview.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/modConfig.js"></script>
  <script src="js/app.js"></script>
  <script src="pages/showcase.js"></script>
  <script src="pages/settings.js"></script>
  <script src="pages/about.js"></script>
  <script src="pages/gamePath.js"></script>
  <script src="pages/baseModsCheck.js"></script>
  <script src="pages/tierSelect.js"></script>
  <script src="pages/install.js"></script>
  <script src="pages/done.js"></script>
  <script src="pages/manageMods.js"></script>
  <script src="js/libraryData.js"></script>
  <script src="pages/library.js"></script>
  <script src="pages/modInstall.js"></script>
  <script src="pages/donate.js"></script>
</body>
</html>

[package]
name = "uhm-launcher"
version = "0.1.3"
description = "UHM Windows launcher and transactional package installer"
authors = ["UHM"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-single-instance = "=2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
ring = "0.17"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
url = "2"
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

# Reuse the released v1 size strategy, preserving unwind-based cleanup.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[package]
name = "uhm-pack-installer"
version = "1.0.0"
description = "UHM Pack Installer — Assetto Corsa graphics mod installer"
authors = ["UHM"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77"

[lib]
name = "uhm_pack_installer_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd", "lzma"] }
unrar = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
base64 = "0.22"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
regex = "1"
once_cell = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

# Size optimisation: the goal of this port is a <10 MB installer.
[profile.release]
opt-level = "z"     # optimise for size
lto = true          # whole-program link-time optimisation
codegen-units = 1   # better optimisation, slower build
panic = "abort"     # drop unwinding tables
strip = true        # remove debug symbols
